#####################################################################
#  toolhead.cfg — EBB36 GEN2 V1.0 toolhead (USB via EBB USB Adapter)
#  Mercury One.1 · Orbiter 2.5 · Rapido V2 UHF · PT1000
#  Hardware only — macros live in macros/. SAVE_CONFIG cannot write
#  here, so PID gains, z_offset and the mesh are in printer.cfg's autosave block.
#####################################################################

[mcu EBBCan]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_1A0040001450315942393520-if00

#--------------------------------------------------------------------
#  Board sensors
#--------------------------------------------------------------------

[temperature_sensor EBB36_driver]   # on-board NTC next to the TMC2209
sensor_type: Generic 3950
sensor_pin: EBBCan: PA0
pullup_resistor: 2200

[lis2dw]                            # accelerometer for input shaping
cs_pin: EBBCan: PB1
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,z,y                     # gravity measured on chip Y → chip Y is printer Z

#--------------------------------------------------------------------
#  Extruder / hotend
#--------------------------------------------------------------------

[extruder]
step_pin: EBBCan: PB14
dir_pin: EBBCan: PA8
enable_pin: !EBBCan: PB6
microsteps: 16
rotation_distance: 4.611            # calibrated 100 mm test (99.43 mm at 4.637)
# rotation_distance: 4.637            # Orbiter 2.5 nominal <original value>
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB4             # HE0 (120 W port, 5 A fuse)
max_power: 0.8                      # cap duty cycle: Rapido UHF 115 W vs 5 A fuse
sensor_type: PT1000
sensor_pin: EBBCan: PA3             # TH0
pullup_resistor: 2200               # GEN2 TH0 has a 2k2 pull-up (not 4k7)
min_temp: 0
max_temp: 350                       # Rapido V2 UHF limit
min_extrude_temp: 170
max_extrude_only_distance: 500      # Orbiter 2.5 recommended
max_extrude_only_velocity: 120
max_extrude_only_accel: 800
max_extrude_only_distance: 150      # load/unload moves longer than the 50 mm default
max_extrude_only_velocity: 60       # in-air max-flow test
max_extrude_cross_section: 5        # KAMP LINE_PURGE needs >= 5
pressure_advance: 0.05			   # as the default for anything without a filament profile:
pressure_advance_smooth_time: 0.040
## PID gains: in the SAVE_CONFIG block at the end of printer.cfg.
## Retune with:  PID_CALIBRATE HEATER=extruder TARGET=250

[tmc2209 extruder]
uart_pin: EBBCan: PB3
run_current: 0.85                   # LDO-36STH20-1004AHG (1.0 A rated) — Orbiter 2.5 recommended
stealthchop_threshold: 0            # spreadCycle (Orbiter recommended): keeps torque at high step rates

#--------------------------------------------------------------------
#  Fans
#--------------------------------------------------------------------

[fan]                               # part cooling blower on FAN1
pin: EBBCan: PA5

[heater_fan hotend_fan]             # Noctua NF-A4x10 24V on FAN2, tach wired
pin: EBBCan: PD2
heater: extruder
heater_temp: 50.0
tachometer_pin: ^EBBCan: PA4
tachometer_ppr: 2
# Noctua blue (PWM) wire is NOT connected — PA15 (ENDSTOP) has no hardware PWM.

#--------------------------------------------------------------------
#  Orbiter 2.5 smart filament sensor — on the I2C header (P14)
#  Sensor pin 1 FTU → P14.3 (SCL, PA7)   pin 3 VCC → P14.1 (5V)
#  Sensor pin 2 FS  → P14.4 (SDA, PA6)   pin 4 GND → P14.2 (GND)
#  Board has 10k pull-ups + 470R + Schottky clamps on both lines.
#--------------------------------------------------------------------

[filament_switch_sensor filament_sensor]   # FS: filament present/absent
switch_pin: ^EBBCan: PA6
pause_on_runout: False              # _RUNOUT in macros/filament.cfg pauses + prompts
runout_gcode:
    _RUNOUT
insert_gcode:
    _INSERT
event_delay: 3.0
pause_delay: 0.5

[gcode_button orbiter_ftu]          # FTU: tangle while printing, unload button when idle
pin: ^EBBCan: PA7
press_gcode:
    _ORBITER_FTU
release_gcode:

#--------------------------------------------------------------------
#  BLTouch — PROBE header (PB8 via optocoupler → inverted; PB5 servo)
#  Temporary until Beacon arrives
#--------------------------------------------------------------------
[bltouch]
sensor_pin: ^!EBBCan: PB8
control_pin: EBBCan: PB5
x_offset: -35.75                    # E34M1 BLTouch mount
y_offset: -8.75
#z_offset: 0                        # set by PROBE_CALIBRATE → SAVE_CONFIG
speed: 5
lift_speed: 10
samples: 2
sample_retract_dist: 3
samples_tolerance: 0.05
samples_tolerance_retries: 3
stow_on_each_sample: True
probe_with_touch_mode: True

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 20, 5                     # probe coords; nozzle at (-15.75, -3.75)
mesh_max: 230, 236                  # nozzle at (265.75, 246.25)
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10

