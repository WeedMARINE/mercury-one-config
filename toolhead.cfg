#####################################################################
#  toolhead.cfg — EBB36 GEN2 V1.0 toolhead (USB via EBB USB Adapter)
#  Mercury One.1 · Orbiter 2.5 · Rapido V2 UHF · PT1000
#  Included from printer.cfg. SAVE_CONFIG cannot write here, so PID
#  gains live in the autosave block at the end of printer.cfg.
#####################################################################

[mcu EBBCan]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_1A0040001450315942393520-if00

#--------------------------------------------------------------------
#  Board sensors
#--------------------------------------------------------------------

[temperature_sensor EBB36_driver]   # on-board NTC next to the TMC2209
sensor_type: Generic 3950
sensor_pin: EBBCan: PA0
pullup_resistor: 2200

[lis2dw]                            # accelerometer for input shaping
cs_pin: EBBCan: PB1
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,z,y                     # gravity measured on chip Y → chip Y is printer Z

#--------------------------------------------------------------------
#  Extruder / hotend
#--------------------------------------------------------------------

[extruder]
step_pin: EBBCan: PB14
dir_pin: EBBCan: PA8
enable_pin: !EBBCan: PB6
microsteps: 16
rotation_distance: 4.637            # Orbiter 2.5 nominal; calibrate with 100 mm test <original value>
# rotation_distance: 4.611            # calibrated 100 mm test (99.43 mm at 4.637)
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB4             # HE0 (120 W port, 5 A fuse)
max_power: 0.8                      # cap duty cycle: Rapido UHF 115 W vs 5 A fuse
sensor_type: PT1000
sensor_pin: EBBCan: PA3             # TH0
pullup_resistor: 2200               # GEN2 TH0 has a 2k2 pull-up (not 4k7)
min_temp: 0
max_temp: 350                       # Rapido V2 UHF limit
min_extrude_temp: 170
max_extrude_only_distance: 150     # allow load/unload moves longer than the 50 mm default
max_extrude_only_velocity: 60	   # for max flow test
pressure_advance: 0.05			   # as the default for anything without a filament profile:
pressure_advance_smooth_time: 0.040
## PID gains: in the SAVE_CONFIG block at the end of printer.cfg.
## Retune with:  PID_CALIBRATE HEATER=extruder TARGET=250

[tmc2209 extruder]
uart_pin: EBBCan: PB3
run_current: 0.85                   # LDO-36STH20-1004AHG (1.0 A rated)
stealthchop_threshold: 999999       # always stealthChop — removes the idle whine

#--------------------------------------------------------------------
#  Fans
#--------------------------------------------------------------------

[fan]                               # part cooling blower on FAN1
pin: EBBCan: PA5

[heater_fan hotend_fan]             # Noctua NF-A4x10 24V on FAN2, tach wired
pin: EBBCan: PD2
heater: extruder
heater_temp: 50.0
tachometer_pin: ^EBBCan: PA4
tachometer_ppr: 2
# Noctua blue (PWM) wire is NOT connected — PA15 (ENDSTOP) has no hardware PWM.

#--------------------------------------------------------------------
#  Orbiter 2.5 smart filament sensor — on the I2C header (P14)
#  Sensor pin 1 FTU → P14.3 (SCL, PA7)   pin 3 VCC → P14.1 (5V)
#  Sensor pin 2 FS  → P14.4 (SDA, PA6)   pin 4 GND → P14.2 (GND)
#  Board has 10k pull-ups + 470R + Schottky clamps on both lines.
#--------------------------------------------------------------------

[filament_switch_sensor filament_sensor]   # FS: filament present/absent
switch_pin: ^EBBCan: PA6
pause_on_runout: True
runout_gcode:
    M117 Filament runout
event_delay: 3.0
pause_delay: 0.5

[gcode_button orbiter_ftu]          # FTU: tangle while printing, unload button when idle
pin: ^EBBCan: PA7
press_gcode:
    _ORBITER_FTU
release_gcode:

[gcode_macro _ORBITER_FTU]
gcode:
    {% if printer.print_stats.state == "printing" %}
        M117 Filament tangle detected
        PAUSE
    {% else %}
        UNLOAD_FILAMENT
    {% endif %}


#--------------------------------------------------------------------
#  BLTouch — PROBE header (PB8 via optocoupler → inverted; PB5 servo)
#  Temporary until Beacon arrives
#--------------------------------------------------------------------
[bltouch]
sensor_pin: ^!EBBCan: PB8
control_pin: EBBCan: PB5
x_offset: -35.75                    # E34M1 BLTouch mount
y_offset: -8.75
#z_offset: 0                        # set by PROBE_CALIBRATE → SAVE_CONFIG
speed: 5
lift_speed: 10
samples: 2
sample_retract_dist: 3
samples_tolerance: 0.05
samples_tolerance_retries: 3
stow_on_each_sample: True
probe_with_touch_mode: True

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 20, 5                     # probe coords; nozzle at (-15.75, -3.75)
mesh_max: 230, 236                  # nozzle at (265.75, 246.25)
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10

#--------------------------------------------------------------------
#  Resonance Testing
#  Temporary until Beacon arrives
#--------------------------------------------------------------------
[resonance_tester]
accel_chip: lis2dw
probe_points: 130, 130, 30

[shaketune]
# defaults are fine; results go to ~/printer_data/config/ShakeTune_results

#--------------------------------------------------------------------
#  Filament load / unload — Prusa-style guided flow
#  LOAD_FILAMENT  : material list → preheat → insert (auto-start on
#                   sensor) → feed+purge → check → Yes/Purge more/Retry
#  UNLOAD_FILAMENT: preheat (last material) → eject → remove → Done/Load new
#--------------------------------------------------------------------

[gcode_macro _FILAMENT_VARS]
variable_last_temp: 230             # temp of the material last loaded (unload default)
variable_unload_len: 70             # gear → nozzle tip, approx; raise if gears still grip
variable_load_len: 60               # gear → melt zone
variable_purge_len: 25
variable_wait_ticks: 0              # countdown for the insert-wait poll
gcode:

# ---- shared material menu; NEXT = macro to call with TEMP= ---------
[gcode_macro _MATERIAL_PROMPT]
gcode:
    {% set n = params.NEXT %}
    RESPOND TYPE=command MSG="action:prompt_begin {params.TITLE}"
    RESPOND TYPE=command MSG="action:prompt_text Select material:"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button PLA 215|{n} TEMP=215|primary"
    RESPOND TYPE=command MSG="action:prompt_button PETG 230|{n} TEMP=230|primary"
    RESPOND TYPE=command MSG="action:prompt_button ASA 260|{n} TEMP=260|primary"
    RESPOND TYPE=command MSG="action:prompt_button ABS 255|{n} TEMP=255|primary"
    RESPOND TYPE=command MSG="action:prompt_button PC 275|{n} TEMP=275|primary"
    RESPOND TYPE=command MSG="action:prompt_button PA 285|{n} TEMP=285|primary"
    RESPOND TYPE=command MSG="action:prompt_button FLEX 240|{n} TEMP=240|primary"
    RESPOND TYPE=command MSG="action:prompt_button PP 240|{n} TEMP=240|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

# ======================= LOAD =======================================
[gcode_macro LOAD_FILAMENT]
description: Guided load. Uses TEMP=, else an already-set nozzle target (HelixScreen), else the material menu
gcode:
    {% set target = printer.extruder.target|int %}
    {% set min_t = printer.configfile.settings.extruder.min_extrude_temp|int %}
    {% if printer.print_stats.state == "printing" %}
        { action_respond_info("Printing - PAUSE first") }
    {% elif params.TEMP is not defined and target < min_t %}
        _MATERIAL_PROMPT TITLE="Load filament" NEXT=LOAD_FILAMENT
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        {% set temp = params.TEMP|default(target)|int %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=last_temp VALUE={temp}
        M117 Preheating nozzle to {temp}
        M109 S{temp}
        {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
            _LOAD_FEED
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_begin Load filament"
            RESPOND TYPE=command MSG="action:prompt_text Insert filament into the extruder."
            RESPOND TYPE=command MSG="action:prompt_footer_button Start now|_LOAD_FEED|primary"
            RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_LOAD_CANCEL|secondary"
            RESPOND TYPE=command MSG="action:prompt_show"
            SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=wait_ticks VALUE=240   # 240 x 0.5 s = 2 min
            UPDATE_DELAYED_GCODE ID=_LOAD_WAIT DURATION=0.5
        {% endif %}
    {% endif %}

# poll the sensor while waiting for the user to insert filament
[delayed_gcode _LOAD_WAIT]
gcode:
    {% set v = printer["gcode_macro _FILAMENT_VARS"] %}
    {% if v.wait_ticks <= 0 %}
        _LOAD_CANCEL
    {% elif printer["filament_switch_sensor filament_sensor"].filament_detected %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=wait_ticks VALUE=0
        _LOAD_FEED
    {% else %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=wait_ticks VALUE={v.wait_ticks - 1}
        UPDATE_DELAYED_GCODE ID=_LOAD_WAIT DURATION=0.5
    {% endif %}

[gcode_macro _LOAD_CANCEL]
gcode:
    SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=wait_ticks VALUE=0
    UPDATE_DELAYED_GCODE ID=_LOAD_WAIT DURATION=0
    RESPOND TYPE=command MSG="action:prompt_end"
    M104 S0
    M117 Load cancelled

[gcode_macro _LOAD_FEED]
gcode:
    SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=wait_ticks VALUE=0
    UPDATE_DELAYED_GCODE ID=_LOAD_WAIT DURATION=0
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set v = printer["gcode_macro _FILAMENT_VARS"] %}
    M117 Loading filament...
    M83
    G1 E{v.load_len} F600               ; through gears to the melt zone
    G1 E{v.purge_len} F150              ; slow purge
    M400
    _LOAD_CHECK

[gcode_macro _LOAD_CHECK]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Load filament"
    RESPOND TYPE=command MSG="action:prompt_text Is the new color extruding cleanly?"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Yes|_LOAD_DONE|primary"
    RESPOND TYPE=command MSG="action:prompt_button Purge more|_LOAD_PURGE|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Not extruding|_LOAD_RETRY|warning"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LOAD_PURGE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set v = printer["gcode_macro _FILAMENT_VARS"] %}
    M83
    G1 E{v.purge_len} F150
    M400
    _LOAD_CHECK

[gcode_macro _LOAD_RETRY]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set v = printer["gcode_macro _FILAMENT_VARS"] %}
    M83
    G1 E-{v.unload_len} F600            ; back out past the gears
    M400
    LOAD_FILAMENT TEMP={v.last_temp}    ; re-enter at the insert step

[gcode_macro _LOAD_DONE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    M117 Filament loaded

# ======================= UNLOAD =====================================
[gcode_macro UNLOAD_FILAMENT]
description: Guided unload. Uses last loaded material temp unless TEMP= given
gcode:
    {% set v = printer["gcode_macro _FILAMENT_VARS"] %}
    {% if printer.print_stats.state == "printing" %}
        { action_respond_info("Printing - PAUSE first") }
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        {% set temp = params.TEMP|default(v.last_temp)|int %}
        {% if printer.extruder.temperature < temp - 10 %}
            M117 Preheating nozzle to {temp}
            M109 S{temp}
        {% endif %}
        M117 Unloading filament...
        M83
        G1 E5 F300                      ; soften tip
        G1 E-15 F1800                   ; fast pull out of the melt zone
        G1 E-{v.unload_len} F600        ; clear the extruder gears
        M400
        RESPOND TYPE=command MSG="action:prompt_begin Unload filament"
        RESPOND TYPE=command MSG="action:prompt_text Pull the filament out of the extruder."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Done|_UNLOAD_DONE|primary"
        RESPOND TYPE=command MSG="action:prompt_button Load new|LOAD_FILAMENT|primary"
        RESPOND TYPE=command MSG="action:prompt_button Stuck - retry|UNLOAD_FILAMENT|warning"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _UNLOAD_DONE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    M104 S0
    M117 Filament unloaded