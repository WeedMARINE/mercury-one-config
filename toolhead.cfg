#####################################################################
#  toolhead.cfg — EBB36 GEN2 V1.0 toolhead (USB via EBB USB Adapter)
#  Mercury One.1 · Orbiter 2.5 · Rapido V2 UHF · PT1000
#  Hardware only — macros live in macros/. Beacon probe section here. SAVE_CONFIG cannot write
#  here, so PID gains, z_offset and the mesh are in printer.cfg's autosave block.
#####################################################################

[mcu EBBCan]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_1A0040001450315942393520-if00

#--------------------------------------------------------------------
#  Board sensors
#--------------------------------------------------------------------

[temperature_sensor EBB36_driver]   # on-board NTC next to the TMC2209
sensor_type: Generic 3950
sensor_pin: EBBCan: PA0
pullup_resistor: 2200

[lis2dw]                            # accelerometer for input shaping
cs_pin: EBBCan: PB1
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,z,y                     # gravity measured on chip Y → chip Y is printer Z

#--------------------------------------------------------------------
#  Extruder / hotend
#--------------------------------------------------------------------

[extruder]
step_pin: EBBCan: PB14
dir_pin: EBBCan: PA8
enable_pin: !EBBCan: PB6
microsteps: 16
rotation_distance: 4.611            # calibrated 100 mm test (99.43 mm at 4.637)
# rotation_distance: 4.637            # Orbiter 2.5 nominal <original value>
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB4             # HE0 (120 W port, 5 A fuse)
max_power: 0.8                      # cap duty cycle: Rapido UHF 115 W vs 5 A fuse
sensor_type: PT1000
sensor_pin: EBBCan: PA3             # TH0
pullup_resistor: 2200               # GEN2 TH0 has a 2k2 pull-up (not 4k7)
min_temp: 0
max_temp: 350                       # Rapido V2 UHF limit
min_extrude_temp: 170
max_extrude_only_distance: 500      # Orbiter 2.5 recommended
max_extrude_only_velocity: 120
max_extrude_only_accel: 800
max_extrude_only_distance: 150      # load/unload moves longer than the 50 mm default
max_extrude_only_velocity: 60       # in-air max-flow test
max_extrude_cross_section: 5        # KAMP LINE_PURGE needs >= 5
pressure_advance: 0.05			   # as the default for anything without a filament profile:
pressure_advance_smooth_time: 0.040
## PID gains: in the SAVE_CONFIG block at the end of printer.cfg.
## Retune with:  PID_CALIBRATE HEATER=extruder TARGET=250

[tmc2209 extruder]
uart_pin: EBBCan: PB3
run_current: 0.85                   # LDO-36STH20-1004AHG (1.0 A rated) — Orbiter 2.5 recommended
stealthchop_threshold: 0            # spreadCycle (Orbiter recommended): keeps torque at high step rates

#--------------------------------------------------------------------
#  Fans
#--------------------------------------------------------------------

[fan]                               # part cooling blower on FAN1
pin: EBBCan: PA5

[heater_fan hotend_fan]             # Noctua NF-A4x10 24V on FAN2, tach wired
pin: EBBCan: PD2
heater: extruder
heater_temp: 50.0
tachometer_pin: ^EBBCan: PA4
tachometer_ppr: 2
# Noctua blue (PWM) wire is NOT connected — PA15 (ENDSTOP) has no hardware PWM.

#--------------------------------------------------------------------
#  Orbiter 2.5 smart filament sensor — on the I2C header (P14)
#  Sensor pin 1 FTU → P14.3 (SCL, PA7)   pin 3 VCC → P14.1 (5V)
#  Sensor pin 2 FS  → P14.4 (SDA, PA6)   pin 4 GND → P14.2 (GND)
#  Board has 10k pull-ups + 470R + Schottky clamps on both lines.
#--------------------------------------------------------------------

[filament_switch_sensor filament_sensor]   # FS: filament present/absent
switch_pin: ^EBBCan: PA6
pause_on_runout: False              # _RUNOUT in macros/filament.cfg pauses + prompts
runout_gcode:
    _RUNOUT
insert_gcode:
    _INSERT
event_delay: 3.0
pause_delay: 0.5

[gcode_button orbiter_ftu]          # FTU: tangle while printing, unload button when idle
pin: ^EBBCan: PA7
press_gcode:
    _ORBITER_FTU
release_gcode:

#--------------------------------------------------------------------
#  Beacon RevH — USB to the Pi. E34M1 "UHF Dual Horns" Beacon mount
#  (Psych0h3ad v0.2): coil 17 mm BEHIND the nozzle, X 0.
#  Homing: Beacon's own helper (home_xy_position) replaces
#  [homing_override]; sensorless current drop / back-off live in the
#  home_gcode_* hooks below. Z homes by nozzle CONTACT at bed centre
#  and auto-calibrates the proximity model when unhomed; later G28 Z
#  uses proximity. Keep the nozzle clean for contact homing.
#--------------------------------------------------------------------
[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_58CA51CD5157383837202020FF073540-if00
x_offset: 0
y_offset: 17
mesh_main_direction: x
mesh_runs: 2
default_model_name: default
contact_max_hotend_temperature: 180
# -- homing helper (replaces safe_z_home / homing_override) --
home_xy_position: 130, 130          # nozzle over bed centre for contact
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
home_method: contact
home_method_when_homed: proximity
home_autocalibrate: unhomed
home_y_before_x: False              # X homes right first, then Y front
home_gcode_pre_xy:
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.6
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.6
    G4 P1000                        # let the motors settle at the new current
home_gcode_post_x:
    G91
    G1 X-10 F1200                   # back off the right stop
    G90
    M400
    G4 P2000                        # CoreXY sensorless: settle before the Y move or StallGuard false-triggers
home_gcode_post_y:
    G91
    G1 Y10 F1200                    # back off the front stop
    G90
    M400
    G4 P1000
home_gcode_post_xy:
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.0
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.0
# -- contact auto-calibration --
autocal_speed: 3
autocal_accel: 100
autocal_retract_dist: 2
autocal_retract_speed: 10
autocal_sample_count: 3
autocal_tolerance: 0.008
autocal_max_retries: 3

[bed_mesh]                          # Beacon scan: coil 17 mm behind nozzle
speed: 200
horizontal_move_z: 2                # Beacon trigger distance
mesh_min: 10, 10                    # probe coords; nozzle at (10, -7)
mesh_max: 250, 240                  # nozzle at (250, 223)
probe_count: 15, 15
algorithm: bicubic
zero_reference_position: 130, 130   # same spot Z homes at (probe coords)
fade_start: 1
fade_end: 10

