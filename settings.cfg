#####################################################################
#  settings.cfg — every user-tunable number in one place
#
#  Change behaviour here; the macros in macros/ and beacon.cfg read these
#  at run time. Hardware facts (pins, currents, geometry, shapers) stay in
#  printer.cfg / ebb36.cfg / beacon.cfg. Measured values written by the
#  printer itself (nozzle expansion coefficient/multiplier) live in
#  variables.cfg via [save_variables].
#####################################################################

# ---- general: parking, soak, purge line ----------------------------
[gcode_macro _SETTINGS]
variable_heat_park_x: 130           # where the head waits while the bed heats (bed centre)
variable_heat_park_y: 130
variable_park_x: 240                # end-of-print / pause / filament-change park (rear-right,
variable_park_y: 240                #   clear of the belt tower). Keep _CLIENT_VARIABLE below equal
variable_idle_park_x: 20            # idle filament load/unload: over the purge zone, front-left
variable_idle_park_y: 5
variable_idle_park_z: 60            # bed dropped at least this far for idle load/unload/cold pull
variable_soak_minutes: 10           # START_PRINT soak when the bed target is >= soak_bed_min (ASA/ABS)
variable_soak_bed_min: 90           #   (SOAK= on START_PRINT overrides)
variable_purge_line_x: 10           # PURGE_LINE (manual purge): start X, Y and length along X
variable_purge_line_y: 1
variable_purge_line_len: 100
gcode:

# ---- mainsail.cfg PAUSE / RESUME / CANCEL_PRINT -------------------
# plain values only (read by mainsail.cfg); park must match park_x/y above
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 240
variable_custom_park_y    : 240
variable_custom_park_dz   : 10      # lift on pause
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35
variable_unretract        : 1.0
variable_speed_unretract  : 35
variable_speed_hop        : 15
variable_speed_move       : 100
variable_park_at_cancel   : True
variable_park_at_cancel_x : 240
variable_park_at_cancel_y : 240
variable_use_fw_retract   : False
variable_idle_timeout     : 1800    # keep heaters for 30 min while paused
gcode:


# ---- filament load / unload ----------------------------------------
[gcode_macro _FILAMENT_VARS]
variable_last_temp: 230             # temp of the material last loaded (unload default)
variable_unload_len: 70             # gear -> nozzle tip, approx; raise if gears still grip
variable_load_len: 60               # gear -> melt zone
variable_purge_len: 25
variable_wait_ticks: 0              # countdown for the insert-wait poll
variable_tangle_detection: 1        # Orbiter FTU while printing: 1 = pause + prompt, 0 = console message only
gcode:

# ---- Beacon nozzle thermal expansion defaults ----------------------
# contact Z=0 is found at contact_temp; START_PRINT lifts Z by
#   multiplier x (print_temp - contact_temp) x coefficient / 100
# variables.cfg overrides both numbers once measured / saved.
[gcode_macro _BEACON_VARS]
variable_contact_temp: 150          # nozzle temp used for every contact touch
variable_expansion_coefficient: 0.07    # mm / 100 C default; variables.cfg overrides when measured
variable_expansion_multiplier: 1.0      # default; variables.cfg overrides when saved
gcode:

# ---- KAMP Smart Park / Line Purge ----------------------------------
# SMART_PARK parks just in front of the print for final heating; LINE_PURGE
# purges a line purge_margin mm in front of (or left of) the print area.
# Both read object bounds from [exclude_object] — needs "Label objects:
# Firmware-specific" in PrusaSlicer; without objects they fall back to
# bed centre / front-left.
[gcode_macro _KAMP_Settings]
description: This macro contains all adjustable settings for KAMP
variable_verbose_enable: True               # console output while running
variable_mesh_margin: 0                     # (adaptive mesh is Klipper-native here; unused)
variable_fuzz_amount: 0
variable_probe_dock_enable: False
variable_attach_macro: 'Attach_Probe'
variable_detach_macro: 'Dock_Probe'
variable_purge_height: 0.8                  # nozzle Z during purge
variable_tip_distance: 5                    # = END_PRINT retract, so the line starts promptly
variable_purge_margin: 20                   # gap between purge line and print area (10 felt too close)
variable_purge_edge_inset: 3                # purge line stays at least this far inside the sheet edge (mm)
variable_purge_amount: 40                   # mm of filament
variable_flow_rate: 12                      # mm3/s during purge (well under the 30 cap)
variable_smart_park_height: 10
gcode:
    {action_respond_info(" Running the KAMP_Settings macro does nothing, it is only used for storing KAMP settings. ")}
