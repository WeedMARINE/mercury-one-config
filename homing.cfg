#####################################################################
#Lower the homing current. 
#Less torque means the motor stalls cleanly on contact instead of pushing (and it protects the frame). 
#This is standard on 5160 builds. Add these macros and use them instead of raw G28:
#####################################################################

[gcode_macro _HOME_X]
gcode:
    {% set HOME_CUR = 0.6 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
    G28 X
    G91
    G1 X -10 F1200          # back off the stop
    G90
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.0
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.0

[gcode_macro _HOME_Y]
gcode:
    {% set HOME_CUR = 0.6 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
    G28 Y
    G91
    G1 Y 10 F1200
    G90
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.0
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.0

[homing_override]
axes: xyz
set_position_z: 0                   # lets the Z hop run before Z is homed
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    G90
    G1 Z10 F600                     # hop: bed moves 10 mm away from the nozzle

    {% if home_all or 'X' in params %}
        _HOME_X
    {% endif %}

    {% if home_all or 'Y' in params %}
        _HOME_Y
    {% endif %}

    {% if home_all or 'Z' in params %}
        {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
            _HOME_X
            _HOME_Y
        {% endif %}
        G1 X165.75 Y138.75 F6000    # probe over bed centre (130,130)
        G28 Z
        G1 Z10 F600
    {% endif %}