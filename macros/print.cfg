#####################################################################
#  macros/print.cfg — print start/end, purge, pause/resume settings
#
#  PrusaSlicer start G-code:
#      M104 S0
#      M140 S0
#      START_PRINT BED=[first_layer_bed_temperature] EXTRUDER=[first_layer_temperature]
#  (SOAK= optional; defaults to 10 min when the bed is 90 C or more, i.e. ASA/ABS)
#  PrusaSlicer end G-code:  END_PRINT
#  PAUSE / RESUME / CANCEL_PRINT come from mainsail.cfg and read
#  _CLIENT_VARIABLE below. SMART_PARK / LINE_PURGE are KAMP (macros/kamp_*).
#  PURGE_LINE (fixed front-left line) is kept for manual use.
#####################################################################

[gcode_macro START_PRINT]
description: Home, heat, level, mesh, purge. Params: BED, EXTRUDER, SOAK (minutes; default 10 if BED >= 90, else 0)
gcode:
    {% set bed = params.BED|int %}
    {% set hot = params.EXTRUDER|int %}
    {% set soak = params.SOAK|default(10 if bed >= 90 else 0)|int %}
    {% if hot < 170 or bed < 1 %}
        { action_raise_error("START_PRINT: bad temps BED=%s EXTRUDER=%s" % (bed, hot)) }
    {% endif %}

    M117 Homing
    BED_MESH_CLEAR
    G28
    G90

    M117 Heating bed
    G1 X130 Y130 Z15 F6000          # park over bed centre while heating
    M140 S{bed}
    M104 S150                       # nozzle warm but not oozing
    M190 S{bed}
    {% if soak > 0 %}
        {% for m in range(soak, 0, -1) %}
            M117 Heat soak {m} min
            G4 P60000
        {% endfor %}
    {% endif %}

    M117 Levelling
    Z_TILT_ADJUST
    G28 Z

    M117 Bed mesh
    BED_MESH_CALIBRATE ADAPTIVE=1   # probes only the print area (needs label objects in slicer)

    M117 Heating nozzle
    SMART_PARK                      # park just in front of the print area while heating
    M107
    M109 S{hot}

    LINE_PURGE                      # purge line 10 mm in front of the print (KAMP)
    G92 E0
    M117 Printing

[gcode_macro END_PRINT]
gcode:
    M400
    G92 E0
    G1 E-5 F3000                    # retract
    G91
    G1 Z2 F600                      # lift off the part
    G90
    G1 X240 Y240 F6000              # park rear-right, clear of the belt tower
    {% if printer.toolhead.position.z < 150 %}
        G91
        G1 Z20 F600                 # drop the bed further if there is room
        G90
    {% endif %}
    TURN_OFF_HEATERS
    M107
    M84                             # motors off
    M117 Print complete

[gcode_macro PURGE_LINE]
description: Purge line along the front edge (X 10-110, Y 1). PURGE_TEMP= heats first (HelixScreen passes it)
gcode:
    {% set min_t = printer.configfile.settings.extruder.min_extrude_temp|int %}
    {% if params.PURGE_TEMP is defined and params.PURGE_TEMP|int >= min_t %}
        M109 S{params.PURGE_TEMP|int}
    {% elif printer.extruder.target|int >= min_t %}
        M109 S{printer.extruder.target|int}      # wait for a target that is already set
    {% elif printer.extruder.temperature < min_t %}
        { action_raise_error("PURGE_LINE: nozzle too cold - pass PURGE_TEMP= or preheat") }
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SAVE_GCODE_STATE NAME=purge
    M117 Purging
    G90
    M83
    G1 Z5 F600
    G1 X10 Y1 F9000
    G1 E8 F200                      # prime in place: refills the melt zone before moving
    G1 Z0.3 F600
    G1 X110 E12 F900                # 100 mm fat line
    G1 Y1.6 F900
    G1 X30 E5 F900                  # return line at reduced flow, pressure already dropping
    G1 E-1.5 F1800                  # retract: UHF melt zone holds pressure
    G1 X10 F3000                    # 20 mm dry wipe leaves the ooze on the plate
    G1 Z3 F600
    M117 Purge done
    RESTORE_GCODE_STATE NAME=purge

# ---- settings for mainsail.cfg's PAUSE / RESUME / CANCEL_PRINT ----
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 240
variable_custom_park_y    : 240
variable_custom_park_dz   : 10      # lift on pause
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35
variable_unretract        : 1.0
variable_speed_unretract  : 35
variable_speed_hop        : 15
variable_speed_move       : 100
variable_park_at_cancel   : True
variable_park_at_cancel_x : 240
variable_park_at_cancel_y : 240
variable_use_fw_retract   : False
variable_idle_timeout     : 1800    # keep heaters for 30 min while paused
gcode:
