#####################################################################
#  macros/print.cfg — print start/end, purge, pause/resume settings
#
#  PrusaSlicer start G-code:
#      M104 S0
#      M140 S0
#      START_PRINT BED=[first_layer_bed_temperature] EXTRUDER=[first_layer_temperature]
#  (SOAK= optional; defaults to 10 min when the bed is 90 C or more, i.e. ASA/ABS)
#  PrusaSlicer end G-code:  END_PRINT
#  PAUSE / RESUME / CANCEL_PRINT come from mainsail.cfg and read
#  _CLIENT_VARIABLE in settings.cfg. SMART_PARK / LINE_PURGE are KAMP (macros/kamp_*).
#  PURGE_LINE (fixed front-left line) is kept for manual use.
#  Numbers (park spots, soak, purge line) come from settings.cfg [_SETTINGS].
#####################################################################

[gcode_macro START_PRINT]
description: Home, heat, level, mesh, purge. Params: BED, EXTRUDER, SOAK (minutes - default from settings.cfg when BED is hot)
gcode:
    {% set bed = params.BED|int %}
    {% set hot = params.EXTRUDER|int %}
    {% set st = printer["gcode_macro _SETTINGS"] %}
    {% set soak = params.SOAK|default(st.soak_minutes if bed >= st.soak_bed_min else 0)|int %}
    {% if hot < 170 or bed < 1 %}
        { action_raise_error("START_PRINT: bad temps BED=%s EXTRUDER=%s" % (bed, hot)) }
    {% endif %}
    SET_GCODE_OFFSET Z=0            # clean slate: expansion offset is re-applied below

    M117 Homing
    BED_MESH_CLEAR
    G28
    G90

    M117 Heating bed
    G1 X{st.heat_park_x} Y{st.heat_park_y} Z15 F6000   # park over bed centre while heating
    M140 S{bed}
    M104 S150                       # nozzle warm but not oozing
    M190 S{bed}
    {% if soak > 0 %}
        {% for m in range(soak, 0, -1) %}
            M117 Heat soak {m} min
            G4 P60000
        {% endfor %}
    {% endif %}

    M117 Levelling
    M109 S150                       # nozzle at contact temp (soft ooze, no dripping)
    G28 Z METHOD=CONTACT CALIBRATE=1    # Beacon: touch plate at bed temp -> Z=0 + fresh proximity model
    Z_TILT_ADJUST

    M117 Bed mesh
    BED_MESH_CALIBRATE ADAPTIVE=1 RUNS=2   # probes only the print area (needs label objects in slicer)
    G28 Z METHOD=CONTACT CALIBRATE=0    # final touch after tilt + mesh (Beacon order), model kept

    M117 Heating nozzle
    SMART_PARK                      # park just in front of the print area while heating
    M107
    M109 S{hot}
    _BEACON_APPLY_TEMP_OFFSET       # lift Z for nozzle growth 150 -> print temp (beacon.cfg)

    LINE_PURGE                      # purge line 10 mm in front of the print (KAMP)
    G92 E0
    M117 Printing

[gcode_macro END_PRINT]
gcode:
    {% set st = printer["gcode_macro _SETTINGS"] %}
    M400
    G92 E0
    G1 E-5 F3000                    # retract
    G91
    G1 Z2 F600                      # lift off the part
    G90
    G1 X{st.park_x} Y{st.park_y} F6000   # park rear-right, clear of the belt tower
    {% if printer.toolhead.position.z < 150 %}
        G91
        G1 Z20 F600                 # drop the bed further if there is room
        G90
    {% endif %}
    TURN_OFF_HEATERS
    M107
    SET_GCODE_OFFSET Z=0            # drop the expansion offset / babysteps
    M84                             # motors off
    M117 Print complete

[gcode_macro PURGE_LINE]
description: Purge line along the front edge (settings.cfg purge_line_*). PURGE_TEMP= heats first (HelixScreen passes it)
gcode:
    {% set st = printer["gcode_macro _SETTINGS"] %}
    {% set px = st.purge_line_x %}
    {% set py = st.purge_line_y %}
    {% set pl = st.purge_line_len %}
    {% set min_t = printer.configfile.settings.extruder.min_extrude_temp|int %}
    {% if params.PURGE_TEMP is defined and params.PURGE_TEMP|int >= min_t %}
        M109 S{params.PURGE_TEMP|int}
    {% elif printer.extruder.target|int >= min_t %}
        M109 S{printer.extruder.target|int}      # wait for a target that is already set
    {% elif printer.extruder.temperature < min_t %}
        { action_raise_error("PURGE_LINE: nozzle too cold - pass PURGE_TEMP= or preheat") }
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SAVE_GCODE_STATE NAME=purge
    M117 Purging
    G90
    M83
    G1 Z5 F600
    G1 X{px} Y{py} F9000
    G1 E8 F200                      # prime in place: refills the melt zone before moving
    G1 Z0.3 F600
    G1 X{px + pl} E{pl * 0.12} F900   # fat line (0.12 mm filament per mm)
    G1 Y{py + 0.6} F900
    G1 X{px + 20} E{pl * 0.05} F900   # return line at reduced flow, pressure already dropping
    G1 E-1.5 F1800                  # retract: UHF melt zone holds pressure
    G1 X{px} F3000                  # 20 mm dry wipe leaves the ooze on the plate
    G1 Z3 F600
    M117 Purge done
    RESTORE_GCODE_STATE NAME=purge
