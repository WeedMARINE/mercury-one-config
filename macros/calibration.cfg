#####################################################################
#  macros/calibration.cfg — levelling shortcut, resonance testing, tuning helpers
#
#  G32                      full home + z_tilt + re-home + park
#  AXES_SHAPER_CALIBRATION  Shake&Tune input shaper (graphs in ShakeTune_results/)
#  COMPARE_BELTS_RESPONSES  Shake&Tune belt tension check
#  PID_HOTEND / PID_BED     PID tune then SAVE_CONFIG
#  Shapers before Beacon: X MZV 66.6, Y MZV 43.6 (LIS2DW on EBB bracket).
#  Re-run with accel_chip beacon after the Beacon install.
#####################################################################

[gcode_macro G32]
description: Full home + z_tilt + re-home + park
gcode:
    BED_MESH_CLEAR
    G28
    Z_TILT_ADJUST
    G28 Z
    G1 X130 Y130 Z30 F6000

[resonance_tester]
accel_chip: beacon                  # Beacon RevH accelerometer, rigid at the nozzle (LIS2DW on the EBB bracket was flexing)
probe_points: 130, 130, 30

[shaketune]
# defaults are fine; results go to ~/printer_data/config/ShakeTune_results

[gcode_macro PID_HOTEND]
description: PID tune the hotend (TEMP=, default 250) with the part fan on, then save
gcode:
    {% set t = params.TEMP|default(250)|int %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X130 Y130 Z30 F6000
    M106 S128                       # half fan: closer to printing conditions
    PID_CALIBRATE HEATER=extruder TARGET={t}
    M107
    SAVE_CONFIG

[gcode_macro PID_BED]
description: PID tune the bed (TEMP=, default 60), then save
gcode:
    {% set t = params.TEMP|default(60)|int %}
    PID_CALIBRATE HEATER=heater_bed TARGET={t}
    SAVE_CONFIG
