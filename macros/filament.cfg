#####################################################################
#  macros/filament.cfg — Prusa-style guided load / unload
#
#  LOAD_FILAMENT   TEMP= given            -> heat, insert, feed, check
#                  no TEMP, nozzle hot    -> same, using current target
#                                            (HelixScreen Load button preheats)
#                  no TEMP, nozzle cold   -> material menu first (Mainsail,
#                                            console, Orbiter button)
#  UNLOAD_FILAMENT heat to last material, eject, "pull it out" prompt
#
#  Dialogs use Klipper action:prompt (Mainsail, KlipperScreen, HelixScreen).
#  Both flows park the bed 60 mm down over the purge corner first.
#  Runout (FS sensor) while printing: _RUNOUT pauses, parks, prompts
#  Load new / Resume / Cancel. Inserting filament while paused offers to load.
#  The Orbiter 2.5 FTU button calls UNLOAD_FILAMENT when idle and PAUSE
#  (tangle) while printing — see _ORBITER_FTU at the bottom.
#####################################################################

[gcode_macro _FILAMENT_VARS]
variable_last_temp: 230             # temp of the material last loaded (unload default)
variable_unload_len: 70             # gear -> nozzle tip, approx; raise if gears still grip
variable_load_len: 60               # gear -> melt zone
variable_purge_len: 25
variable_wait_ticks: 0              # countdown for the insert-wait poll
gcode:

[gcode_macro _FILAMENT_PARK]
description: Park before feeding or ejecting. Idle: bed down 60, purge corner. Paused: pause park spot, Z untouched
gcode:
    {% if "xyz" in printer.toolhead.homed_axes %}
        SAVE_GCODE_STATE NAME=fil_park
        G90
        {% if printer.print_stats.state == "paused" %}
            G1 X240 Y240 F9000      # same spot PAUSE parks at; Z stays so RESUME's return move is safe
        {% else %}
            {% if printer.toolhead.position.z < 60 %}
                G1 Z60 F600         # bed only ever moves away from the nozzle
            {% endif %}
            G1 X20 Y5 F9000         # over the purge zone, front-left
        {% endif %}
        RESTORE_GCODE_STATE NAME=fil_park MOVE=0
    {% endif %}

# ---- shared material menu; NEXT = macro to call with TEMP= ---------
[gcode_macro _MATERIAL_PROMPT]
gcode:
    {% set n = params.NEXT %}
    RESPOND TYPE=command MSG="action:prompt_begin {params.TITLE}"
    RESPOND TYPE=command MSG="action:prompt_text Select material:"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button PLA 215|{n} TEMP=215|primary"
    RESPOND TYPE=command MSG="action:prompt_button PETG 230|{n} TEMP=230|primary"
    RESPOND TYPE=command MSG="action:prompt_button ASA 260|{n} TEMP=260|primary"
    RESPOND TYPE=command MSG="action:prompt_button ABS 255|{n} TEMP=255|primary"
    RESPOND TYPE=command MSG="action:prompt_button PC 275|{n} TEMP=275|primary"
    RESPOND TYPE=command MSG="action:prompt_button PA 285|{n} TEMP=285|primary"
    RESPOND TYPE=command MSG="action:prompt_button FLEX 240|{n} TEMP=240|primary"
    RESPOND TYPE=command MSG="action:prompt_button PP 240|{n} TEMP=240|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

# ======================= LOAD =======================================
[gcode_macro LOAD_FILAMENT]
description: Guided load. Uses TEMP=, else an already-set nozzle target, else the material menu
gcode:
    {% set target = printer.extruder.target|int %}
    {% set min_t = printer.configfile.settings.extruder.min_extrude_temp|int %}
    {% if printer.print_stats.state == "printing" %}
        { action_respond_info("Printing - PAUSE first") }
    {% elif params.TEMP is not defined and target < min_t %}
        _MATERIAL_PROMPT TITLE="Load filament" NEXT=LOAD_FILAMENT
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        {% set temp = params.TEMP|default(target)|int %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=last_temp VALUE={temp}
        M117 Preheating nozzle to {temp}
        M109 S{temp}
        {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
            _LOAD_FEED
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_begin Load filament"
            RESPOND TYPE=command MSG="action:prompt_text Insert filament into the extruder."
            RESPOND TYPE=command MSG="action:prompt_footer_button Start now|_LOAD_FEED|primary"
            RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_LOAD_CANCEL|secondary"
            RESPOND TYPE=command MSG="action:prompt_show"
            SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=wait_ticks VALUE=240   # 240 x 0.5 s = 2 min
            UPDATE_DELAYED_GCODE ID=_LOAD_WAIT DURATION=0.5
        {% endif %}
    {% endif %}

# poll the sensor while waiting for the user to insert filament
[delayed_gcode _LOAD_WAIT]
gcode:
    {% set v = printer["gcode_macro _FILAMENT_VARS"] %}
    {% if v.wait_ticks <= 0 %}
        _LOAD_CANCEL
    {% elif printer["filament_switch_sensor filament_sensor"].filament_detected %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=wait_ticks VALUE=0
        _LOAD_FEED
    {% else %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=wait_ticks VALUE={v.wait_ticks - 1}
        UPDATE_DELAYED_GCODE ID=_LOAD_WAIT DURATION=0.5
    {% endif %}

[gcode_macro _LOAD_CANCEL]
gcode:
    SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=wait_ticks VALUE=0
    UPDATE_DELAYED_GCODE ID=_LOAD_WAIT DURATION=0
    RESPOND TYPE=command MSG="action:prompt_end"
    M104 S0
    M117 Load cancelled

[gcode_macro _LOAD_FEED]
gcode:
    SET_GCODE_VARIABLE MACRO=_FILAMENT_VARS VARIABLE=wait_ticks VALUE=0
    UPDATE_DELAYED_GCODE ID=_LOAD_WAIT DURATION=0
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set v = printer["gcode_macro _FILAMENT_VARS"] %}
    _FILAMENT_PARK
    M117 Loading filament...
    M83
    G1 E{v.load_len} F600           # through gears to the melt zone
    G1 E{v.purge_len} F150          # slow purge
    M400
    _LOAD_CHECK

[gcode_macro _LOAD_CHECK]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Load filament"
    RESPOND TYPE=command MSG="action:prompt_text Is the new color extruding cleanly?"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Yes|_LOAD_DONE|primary"
    RESPOND TYPE=command MSG="action:prompt_button Purge more|_LOAD_PURGE|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Not extruding|_LOAD_RETRY|warning"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LOAD_PURGE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set v = printer["gcode_macro _FILAMENT_VARS"] %}
    M83
    G1 E{v.purge_len} F150
    M400
    _LOAD_CHECK

[gcode_macro _LOAD_RETRY]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set v = printer["gcode_macro _FILAMENT_VARS"] %}
    M83
    G1 E-{v.unload_len} F600        # back out past the gears
    M400
    LOAD_FILAMENT TEMP={v.last_temp}    # re-enter at the insert step

[gcode_macro _LOAD_DONE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    M117 Filament loaded
    {% if printer.print_stats.state == "paused" %}
        RESPOND TYPE=command MSG="action:prompt_begin Filament loaded"
        RESPOND TYPE=command MSG="action:prompt_text Resume the print?"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Resume|RESUME|primary"
        RESPOND TYPE=command MSG="action:prompt_button Stay paused|RESPOND TYPE=command MSG=action:prompt_end|secondary"
        RESPOND TYPE=command MSG="action:prompt_button Cancel print|CANCEL_PRINT|error"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

# ======================= UNLOAD =====================================
[gcode_macro UNLOAD_FILAMENT]
description: Guided unload. Uses last loaded material temp unless TEMP= given
gcode:
    {% set v = printer["gcode_macro _FILAMENT_VARS"] %}
    {% if printer.print_stats.state == "printing" %}
        { action_respond_info("Printing - PAUSE first") }
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        {% set temp = params.TEMP|default(v.last_temp)|int %}
        {% if printer.extruder.temperature < temp - 10 %}
            M117 Preheating nozzle to {temp}
            M109 S{temp}
        {% endif %}
        _FILAMENT_PARK
        M117 Unloading filament...
        M83
        G1 E5 F300                  # soften tip
        G1 E-15 F1800               # fast pull out of the melt zone
        G1 E-{v.unload_len} F600    # clear the extruder gears
        M400
        RESPOND TYPE=command MSG="action:prompt_begin Unload filament"
        RESPOND TYPE=command MSG="action:prompt_text Pull the filament out of the extruder."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Done|_UNLOAD_DONE|primary"
        RESPOND TYPE=command MSG="action:prompt_button Load new|LOAD_FILAMENT|primary"
        RESPOND TYPE=command MSG="action:prompt_button Stuck - retry|UNLOAD_FILAMENT|warning"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _UNLOAD_DONE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    M104 S0
    M117 Filament unloaded

# ======================= Purge (no line on the bed) =================
[gcode_macro PURGE]
description: Park over the purge corner, bed down, push filament through. LENGTH= (default 30), PURGE_TEMP= heats first
gcode:
    {% set v = printer["gcode_macro _FILAMENT_VARS"] %}
    {% set min_t = printer.configfile.settings.extruder.min_extrude_temp|int %}
    {% set length = params.LENGTH|default(30)|int %}
    {% if printer.print_stats.state == "printing" %}
        { action_respond_info("Printing - PAUSE first") }
    {% else %}
        {% if params.PURGE_TEMP is defined and params.PURGE_TEMP|int >= min_t %}
            M109 S{params.PURGE_TEMP|int}
        {% elif printer.extruder.target|int >= min_t %}
            M109 S{printer.extruder.target|int}
        {% elif printer.extruder.temperature < min_t %}
            M109 S{v.last_temp}
        {% endif %}
        _FILAMENT_PARK
        M117 Purging {length} mm
        M83
        G1 E{length} F150
        G1 E-1 F1800
        M400
        M117 Purge done
    {% endif %}

# ======================= Runout / insert (Orbiter FS sensor) ========
# Klipper only fires runout_gcode while printing; insert_gcode fires any time.
[gcode_macro _RUNOUT]
gcode:
    M117 Filament runout
    PAUSE                           # mainsail.cfg: lifts, parks at 240,240, retracts 1 mm
    M400
    RESPOND TYPE=command MSG="action:prompt_begin Filament runout"
    RESPOND TYPE=command MSG="action:prompt_text Print paused. Pull out the old filament, insert the new one."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Load new|_RUNOUT_LOAD|primary"
    RESPOND TYPE=command MSG="action:prompt_button Resume|RESUME|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Cancel print|CANCEL_PRINT|error"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _RUNOUT_LOAD]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set v = printer["gcode_macro _FILAMENT_VARS"] %}
    M83
    G1 E-{v.unload_len} F600        # clear what is left of the old spool from the gears
    M400
    LOAD_FILAMENT                   # nozzle target still set while paused -> no material menu

[gcode_macro _INSERT]
gcode:
    {% if printer.print_stats.state == "paused" and printer.extruder.target|int >= printer.configfile.settings.extruder.min_extrude_temp|int %}
        RESPOND TYPE=command MSG="action:prompt_begin Filament detected"
        RESPOND TYPE=command MSG="action:prompt_text Load it and continue the print?"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Load|LOAD_FILAMENT|primary"
        RESPOND TYPE=command MSG="action:prompt_button Not now|RESPOND TYPE=command MSG=action:prompt_end|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

# ======================= Orbiter FTU button ==========================
# wired to EBB I2C header P14.3 (PA7); [gcode_button orbiter_ftu] is in toolhead.cfg
[gcode_macro _ORBITER_FTU]
gcode:
    {% if printer.print_stats.state == "printing" %}
        M117 Filament tangle detected
        PAUSE                       # mainsail.cfg: lifts, parks at 240,240, retracts 1 mm
        M400
        RESPOND TYPE=command MSG="action:prompt_begin Filament tangle"
        RESPOND TYPE=command MSG="action:prompt_text Print paused. Free the spool, check the filament path, then resume."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Resume|RESUME|primary"
        RESPOND TYPE=command MSG="action:prompt_button Unload|UNLOAD_FILAMENT|secondary"
        RESPOND TYPE=command MSG="action:prompt_button Cancel print|CANCEL_PRINT|error"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif printer.print_stats.state == "paused" %}
        RESPOND TYPE=command MSG="action:prompt_begin Unload filament"
        RESPOND TYPE=command MSG="action:prompt_text Print is paused. Unload the filament now?"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button Unload|UNLOAD_FILAMENT|primary"
        RESPOND TYPE=command MSG="action:prompt_button No|RESPOND TYPE=command MSG=action:prompt_end|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        UNLOAD_FILAMENT
    {% endif %}
