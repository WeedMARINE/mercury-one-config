#####################################################################
#  macros/homing.cfg
#
#  Since the Beacon (2026-11-17) homing is handled by the Beacon
#  homing helper in toolhead.cfg ([beacon] home_xy_position + the
#  home_gcode_* hooks). Those hooks carry the sensorless logic that
#  used to live here: A/B current dropped to 0.6 A for X/Y homing,
#  10 mm back-off from each stop, current restored to 1.0 A.
#  [homing_override] cannot coexist with the Beacon helper.
#  Plain G28 = Z hop 5 -> X (right) -> Y (front) -> move to bed
#  centre -> Z by nozzle contact (first time) or proximity.
#####################################################################
