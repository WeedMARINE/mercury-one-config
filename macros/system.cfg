#####################################################################
#  macros/system.cfg — host-side helpers (need gcode_shell_command)
#####################################################################

[gcode_shell_command config_pull]
command: sh -c "cd ~/printer_data/config && git pull --ff-only 2>&1"
timeout: 30
verbose: True

[gcode_macro CONFIG_PULL]
description: Pull the latest config from GitHub and restart Klipper
gcode:
    RUN_SHELL_COMMAND CMD=config_pull
    RESTART

[gcode_shell_command config_push]
command: sh -c "cd ~/printer_data/config && git add -A && (git commit -qm edit_from_printer || true) && git push 2>&1"
timeout: 30
verbose: True

[gcode_macro CONFIG_PUSH]
description: Commit and push local config edits to GitHub
gcode:
    RUN_SHELL_COMMAND CMD=config_push