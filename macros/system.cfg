#####################################################################
#  macros/system.cfg — host-side helpers (need gcode_shell_command)
#
#  CONFIG_PULL [MSG="why"]  commit local edits, rebase on GitHub main,
#                           push, RESTART. Conflict -> edits saved to
#                           branch printer-edits/<timestamp>, printer
#                           reset to main (see scripts/config_pull.sh)
#  CONFIG_PUSH [MSG="why"]  commit + push only, no restart
#  Tip: Mainsail Settings -> Macros -> enable params to get a MSG box.
#####################################################################

[gcode_shell_command config_pull]
command: sh -c "sh ~/printer_data/config/scripts/config_pull.sh \"$*\" 2>&1" _
timeout: 60
verbose: True

[gcode_macro CONFIG_PULL]
description: Pull the latest config from GitHub (keeping local edits) and restart Klipper. MSG= note for the commit
gcode:
    RUN_SHELL_COMMAND CMD=config_pull PARAMS="{params.MSG|default('')}"
    RESTART

[gcode_shell_command config_push]
command: sh -c "sh ~/printer_data/config/scripts/config_push.sh \"$*\" 2>&1" _
timeout: 30
verbose: True

[gcode_macro CONFIG_PUSH]
description: Commit and push local config edits to GitHub. MSG= note for the commit
gcode:
    RUN_SHELL_COMMAND CMD=config_push PARAMS="{params.MSG|default('')}"
