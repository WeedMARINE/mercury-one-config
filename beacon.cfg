#####################################################################
#  beacon.cfg — Beacon RevH (own USB MCU on the Pi), mounted on the E34M1
#
#  Z homing = nozzle contact (Beacon homing helper; sensorless X/Y logic
#  in the home_gcode_* hooks). Bed mesh = Beacon proximity scan.
#  Nozzle thermal expansion: contact Z=0 is found at 150 C, the nozzle
#  grows going to print temp, so START_PRINT lifts Z by
#      multiplier x (print_temp - 150) x coefficient / 100
#  coefficient = mm per 100 C. Default 0.07 (RatOS: Rapido 2 UHF 0.06-0.08),
#  replaced by BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET's measurement when run.
#  multiplier = fudge, saved by Z_OFFSET_APPLY_PROBE from a layer-1 babystep.
#  Both live in variables.cfg ([save_variables], gitignored).
#####################################################################

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_58CA51CD5157383837202020FF073540-if00
x_offset: 0
y_offset: 17
mesh_main_direction: x
mesh_runs: 2
default_model_name: default
contact_max_hotend_temperature: 270  # start-print touch is at 150; 270 lets BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET probe at 250
# -- homing helper (replaces safe_z_home / homing_override) --
home_xy_position: 130, 130          # nozzle over bed centre for contact
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
home_method: contact
home_method_when_homed: proximity
home_autocalibrate: unhomed
home_y_before_x: False              # X homes right first, then Y front
home_gcode_pre_xy:
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.6
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.6
    G4 P500                         # let the motors settle at the new current
home_gcode_post_x:
    G91
    G1 X-10 F1200                   # back off the right stop
    G90
    M400
    G4 P500                         # CoreXY sensorless: settle before the Y move or StallGuard false-triggers (0.5 s tested ok)
home_gcode_post_y:
    G91
    G1 Y10 F1200                    # back off the front stop
    G90
    M400
    G4 P500
home_gcode_post_xy:
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.0
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.0
# -- contact auto-calibration --
autocal_speed: 3
autocal_accel: 100
autocal_retract_dist: 2
autocal_retract_speed: 10
autocal_sample_count: 3
autocal_tolerance: 0.008
autocal_max_retries: 3

[bed_mesh]                          # Beacon scan: coil 17 mm behind nozzle
speed: 200
horizontal_move_z: 2                # Beacon trigger distance
mesh_min: 10, 10                    # probe coords; nozzle at (10, -7)
mesh_max: 250, 240                  # nozzle at (250, 223)
probe_count: 15, 15
algorithm: bicubic
zero_reference_position: 130, 130   # same spot Z homes at (probe coords)
fade_start: 1
fade_end: 10

#--------------------------------------------------------------------
#  Nozzle thermal expansion compensation (ported from RatOS)
#--------------------------------------------------------------------

[gcode_macro _BEACON_VARS]
variable_contact_temp: 150          # nozzle temp used for every contact touch
variable_expansion_coefficient: 0.07    # mm / 100 C default; variables.cfg overrides when measured
variable_expansion_multiplier: 1.0      # default; variables.cfg overrides when saved
gcode:

[gcode_macro _BEACON_APPLY_TEMP_OFFSET]
description: Lift Z for nozzle growth between the 150 C contact touch and the current nozzle target
gcode:
    {% set v = printer["gcode_macro _BEACON_VARS"] %}
    {% set svv = printer.save_variables.variables %}
    {% set coeff = svv.nozzle_expansion_coefficient|default(v.expansion_coefficient)|float %}
    {% set mult = svv.nozzle_expansion_multiplier|default(v.expansion_multiplier)|float %}
    {% set target = printer.extruder.target|float %}
    {% set dt = target - v.contact_temp %}
    {% if dt > 0 and coeff > 0 %}
        {% set off = mult * dt * coeff / 100 %}
        SET_GCODE_OFFSET Z_ADJUST={"%.4f" % off} MOVE=1
        RESPOND MSG="Beacon: Z +{'%.3f' % off} mm for nozzle expansion ({target|int} C, {'%.3f' % coeff} mm/100C x {'%.2f' % mult})"
    {% endif %}

[gcode_macro Z_OFFSET_APPLY_PROBE]
description: Beacon contact keeps the probe offset at zero - this saves your layer-1 babystep as the expansion multiplier instead
rename_existing: _Z_OFFSET_APPLY_PROBE_BASE
gcode:
    {% set v = printer["gcode_macro _BEACON_VARS"] %}
    {% set svv = printer.save_variables.variables %}
    {% set coeff = svv.nozzle_expansion_coefficient|default(v.expansion_coefficient)|float %}
    {% set z = printer.gcode_move.homing_origin.z|float %}
    {% set dt = printer.extruder.target|float - v.contact_temp %}
    {% if z == 0 %}
        RESPOND MSG="Z offset is 0 - nothing to save"
    {% elif dt <= 0 or coeff <= 0 %}
        { action_raise_error("Nozzle must be at print temperature (offset is scaled by temp)") }
    {% else %}
        {% set mult = (z / dt) / (coeff / 100) %}
        SAVE_VARIABLE VARIABLE=nozzle_expansion_multiplier VALUE={"%.4f" % mult}
        RESPOND MSG="Beacon: saved expansion multiplier {'%.3f' % mult} (Z offset {'%.3f' % z} mm at {printer.extruder.target|int} C). Applied automatically from the next print."
    {% endif %}

[gcode_macro BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET]
description: Measure nozzle growth per 100 C by contact-probing at 150 C and TEMP (default 250). Wipe the nozzle tip first.
gcode:
    {% set v = printer["gcode_macro _BEACON_VARS"] %}
    {% set lo = v.contact_temp|int %}
    {% set hi = params.TEMP|default(250)|int %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SET_GCODE_OFFSET Z=0
    G90
    G1 X130 Y130 Z5 F6000
    M117 Settling
    {% for i in range(10) %}
        BEACON_POKE SPEED=3 TOP=5 BOTTOM=-0.3
    {% endfor %}
    {% for pass in range(2) %}
        M117 Contact at {lo} C
        M109 S{lo}
        G4 P20000                   # let the heat block finish growing
        PROBE PROBE_METHOD=contact PROBE_SPEED=3 LIFT_SPEED=15 SAMPLES=5 SAMPLE_RETRACT_DIST=3 SAMPLES_TOLERANCE=0.005 SAMPLES_TOLERANCE_RETRIES=10 SAMPLES_RESULT=median
        _BEACON_NTO_STORE STAGE=lo
        G1 Z5 F600
        M117 Contact at {hi} C
        M109 S{hi}
        G4 P20000
        PROBE PROBE_METHOD=contact PROBE_SPEED=3 LIFT_SPEED=15 SAMPLES=5 SAMPLE_RETRACT_DIST=3 SAMPLES_TOLERANCE=0.005 SAMPLES_TOLERANCE_RETRIES=10 SAMPLES_RESULT=median
        _BEACON_NTO_STORE STAGE=hi HI={hi} PASS={pass}
        G1 Z5 F600
    {% endfor %}
    M104 S0
    G1 Z30 F600
    M117 Done

[gcode_macro _BEACON_NTO_STORE]
variable_z_lo: 0.0
gcode:
    {% set z = printer.beacon.last_z_result|float %}
    {% if params.STAGE == "lo" %}
        SET_GCODE_VARIABLE MACRO=_BEACON_NTO_STORE VARIABLE=z_lo VALUE={z}
    {% else %}
        {% set v = printer["gcode_macro _BEACON_VARS"] %}
        {% set dt = params.HI|int - v.contact_temp %}
        {% set coeff = (z - printer["gcode_macro _BEACON_NTO_STORE"].z_lo) * 100 / dt %}
        SAVE_VARIABLE VARIABLE=nozzle_expansion_coefficient VALUE={"%.4f" % coeff}
        RESPOND MSG="Beacon: pass {params.PASS|int + 1} nozzle expansion {'%.4f' % coeff} mm/100C (z150 {'%.4f' % printer['gcode_macro _BEACON_NTO_STORE'].z_lo}, z{params.HI} {'%.4f' % z}) - saved"
    {% endif %}

#--------------------------------------------------------------------
#  Diagnostics (ideas from RatOS 2.1 Beacon workflow)
#--------------------------------------------------------------------

[gcode_macro BEACON_POKE_TEST]
description: 5 contact pokes at bed centre. Spread of trigger heights <= 0.01 mm = contact healthy
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X130 Y130 Z5 F6000
    {% for i in range(5) %}
        BEACON_POKE SPEED=3 TOP=5 BOTTOM=-0.3
        _BEACON_POKE_STORE I={i}
    {% endfor %}
    _BEACON_POKE_REPORT
    G1 Z10 F600

[gcode_macro _BEACON_POKE_STORE]
variable_z: [0, 0, 0, 0, 0]
gcode:
    {% set r = printer.beacon.last_poke_result %}
    {% set zs = printer["gcode_macro _BEACON_POKE_STORE"].z %}
    {% set _ = zs.__setitem__(params.I|int, r.trigger_z|float) %}
    SET_GCODE_VARIABLE MACRO=_BEACON_POKE_STORE VARIABLE=z VALUE="{zs}"

[gcode_macro _BEACON_POKE_REPORT]
gcode:
    {% set zs = printer["gcode_macro _BEACON_POKE_STORE"].z %}
    {% set s = zs|sort %}
    RESPOND MSG="Poke trigger Z: {zs|map('round', 4)|list}  range {'%.4f' % (s[-1] - s[0])} mm ({'ok' if s[-1] - s[0] <= 0.01 else 'check nozzle tip / sheet'})"

[gcode_macro BEACON_CONTACT_SPREAD]
description: Contact Z at centre vs 6 points within 2 mm (textured-sheet spread test). APPLY=1 lifts Z by the median
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SET_GCODE_OFFSET Z=0
    G90
    G1 X130 Y130 Z5 F6000
    G28 Z METHOD=CONTACT CALIBRATE=0    # Z=0 at the centre
    {% set pts = [(1.5, 0), (-1.5, 0), (0, 1.5), (0, -1.5), (1.1, 1.1), (-1.1, -1.1)] %}
    {% for p in pts %}
        G1 X{130 + p[0]} Y{130 + p[1]} Z3 F3000
        PROBE PROBE_METHOD=contact PROBE_SPEED=3 LIFT_SPEED=15 SAMPLES=1
        _BEACON_SPREAD_STORE I={loop.index0}
    {% endfor %}
    G1 X130 Y130 Z5 F3000
    _BEACON_SPREAD_REPORT APPLY={params.APPLY|default(0)|int}

[gcode_macro _BEACON_SPREAD_STORE]
variable_z: [0, 0, 0, 0, 0, 0]
gcode:
    {% set zs = printer["gcode_macro _BEACON_SPREAD_STORE"].z %}
    {% set _ = zs.__setitem__(params.I|int, printer.beacon.last_z_result|float) %}
    SET_GCODE_VARIABLE MACRO=_BEACON_SPREAD_STORE VARIABLE=z VALUE="{zs}"

[gcode_macro _BEACON_SPREAD_REPORT]
gcode:
    {% set zs = printer["gcode_macro _BEACON_SPREAD_STORE"].z %}
    {% set s = zs|sort %}
    {% set med = (s[2] + s[3]) / 2 %}
    RESPOND MSG="Contact spread around centre (centre = 0): {zs|map('round', 4)|list}"
    RESPOND MSG="min {'%.4f' % s[0]}  max {'%.4f' % s[-1]}  range {'%.4f' % (s[-1] - s[0])}  median {'%.4f' % med} mm. Range < 0.02 = single-point true zero is fine on this sheet"
    {% if params.APPLY|default(0)|int == 1 and med != 0 %}
        SET_GCODE_OFFSET Z_ADJUST={'%.4f' % med} MOVE=1
        RESPOND MSG="Applied Z_ADJUST {'%.4f' % med} (median of neighbours)"
    {% endif %}

[gcode_macro BEACON_CONTACT_MESH]
description: One-off contact mesh (profile contact) + proximity mesh (profile proximity) at BED= temp for scan-compensation comparison. SAVE_CONFIG afterwards to keep them
gcode:
    {% set bed = params.BED|default(105)|int %}
    {% set soak = params.SOAK|default(10)|int %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    G90
    G1 X130 Y130 Z15 F6000
    M140 S{bed}
    M104 S150
    M190 S{bed}
    {% for m in range(soak, 0, -1) %}
        M117 Heat soak {m} min
        G4 P60000
    {% endfor %}
    M109 S150
    G28 Z METHOD=CONTACT CALIBRATE=1
    Z_TILT_ADJUST
    G28 Z METHOD=CONTACT CALIBRATE=0
    M117 Contact mesh 9x9
    BED_MESH_CALIBRATE PROBE_METHOD=contact SAMPLES=2 SAMPLES_DROP=1 SAMPLES_TOLERANCE_RETRIES=10 MESH_MIN=10,10 MESH_MAX=250,240 PROBE_COUNT=9,9 PROFILE=contact
    M117 Proximity mesh
    BED_MESH_CALIBRATE RUNS=2 PROFILE=proximity
    BED_MESH_CLEAR
    TURN_OFF_HEATERS
    G1 X130 Y130 Z30 F6000
    M117 Done - SAVE_CONFIG to keep profiles
    RESPOND MSG="Profiles contact and proximity saved in memory. Run SAVE_CONFIG to keep them, then compare in the heightmap viewer: range of the difference > 0.03 mm = scan compensation worthwhile"
