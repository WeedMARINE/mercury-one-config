#####################################################################
#  printer.cfg — ZeroG Mercury One.1 "Hydra"
#  Octopus Pro V1.1 (STM32H723, 128K bootloader, 25 MHz) + EBB36 GEN2 (USB)
#  Pi 5 · Klipper/Moonraker/Mainsail · PrusaSlicer
#
#  Frame of reference: X=0,Y=0 = front-left corner of the build sheet.
#  Printable area 260 x 250.  X homes RIGHT (sensorless), Y homes FRONT.
#  +Z lowers the bed.  Z homes by Beacon nozzle contact at bed centre (130,130).
#
#  Layout:  printer.cfg          Octopus side: pins, motion, Z, bed, bay fan (this file)
#           ebb36.cfg            EBB36 side: pins, extruder, hotend, fans, filament sensor
#           beacon.cfg           Beacon: homing helper, bed_mesh, expansion offset, diagnostics
#           settings.cfg         ALL user-tunable numbers (park spots, soak, purge, load lengths,
#                                KAMP, Beacon defaults) — change behaviour here, not in macros
#           macros/print.cfg     START/END_PRINT, PURGE_LINE
#           macros/filament.cfg  guided LOAD/UNLOAD, runout, COLD_PULL, M600
#           macros/calibration.cfg  G32, resonance tester, PID helpers
#           macros/system.cfg    CONFIG_PULL / CONFIG_PUSH (git)
#           macros/kamp_*.cfg    vendored KAMP Smart Park + Line Purge
#           mainsail.cfg         PAUSE/RESUME/CANCEL (symlink, don't edit)
#           variables.cfg        measured values written by macros (not in git)
#  Pins: every physical pin is named once in [board_pins] below / in ebb36.cfg.
#  Autosaved values (PIDs, mesh profiles, beacon model) live in the SAVE_CONFIG block.
#####################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_20001B001351323431323537-if00

#  Octopus Pro V1.1 pin names (the only place physical pins appear).
#  MOTOR0 X/A, MOTOR1 Y/B, MOTOR2 Z front-left, MOTOR3 Z1 front-right
#  (enable is PA2 on V1.1), MOTOR4 Z2 rear.  Bed heater BED_OUT PA1,
#  bed NTC TH0 PF3.  TH1 PF4 spare (surface thermistor idea).
#  FAN2 PD12 = driver blower; FAN3 PD13 / FAN4 PD14 / FAN5 PD15 spare.
[board_pins octopus]
aliases:
    x_step_pin=PF13, x_dir_pin=PF12, x_enable_pin=PF14, x_cs_pin=PC4, x_diag_pin=PG6,
    y_step_pin=PG0, y_dir_pin=PG1, y_enable_pin=PF15, y_cs_pin=PD11, y_diag_pin=PG9,
    z_step_pin=PF11, z_dir_pin=PG3, z_enable_pin=PG5, z_cs_pin=PC6,
    z1_step_pin=PG4, z1_dir_pin=PC1, z1_enable_pin=PA2, z1_cs_pin=PC7,
    z2_step_pin=PF9, z2_dir_pin=PF10, z2_enable_pin=PG2, z2_cs_pin=PF2,
    bed_heater_pin=PA1, bed_sensor_pin=PF3, surface_sensor_pin=PF4,
    driver_fan_pin=PD12, fan3_pin=PD13, fan4_pin=PD14, fan5_pin=PD15

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 6000                     # MZV on Y allows ~6.7k; was 5000
minimum_cruise_ratio: 0.5
square_corner_velocity: 5
max_z_velocity: 10
max_z_accel: 100

[input_shaper]                      # Shake&Tune 2026-11-18, Beacon accelerometer at the nozzle, on the table
shaper_type_x: mzv                  # X single peak 64.8 Hz
shaper_freq_x: 66.0
shaper_type_y: mzv                  # Y 45.4 Hz main + 70 Hz minor (6.7 % residual). Alt: 2hump_ei 66.8 @ accel 4500
shaper_freq_y: 47.6

[force_move]
enable_force_move: True

#####################################################################
#  A/B motion — LDO 42STH48-2004MAH 0.9°, 48 V MOTOR_POWER
#  TMC5160T Pro, DIAG jumpers fitted, sensorless homing
#####################################################################

# ---- Slot 0 / MOTOR0 — X (A) ---------------------------------------
[stepper_x]
step_pin: x_step_pin
dir_pin: !x_dir_pin
enable_pin: !x_enable_pin
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_min: -20                   # sheet left edge is 20 mm right of the left stop
position_endstop: 270               # homes against the RIGHT stop
position_max: 270
homing_speed: 20
homing_retract_dist: 0              # back-off handled by the Beacon homing hooks (beacon.cfg)

[tmc5160 stepper_x]
cs_pin: x_cs_pin
spi_bus: spi1
run_current: 1.0                    # no hold_current: driver fan handles standstill heat
sense_resistor: 0.075
stealthchop_threshold: 0
diag1_pin: ^!x_diag_pin
driver_SGT: 1                       # sensorless sensitivity (lower = more sensitive)
driver_TBL: 2                       # chopper: live-tested 2026-11-15 against the 40/80 mm/s
driver_TOFF: 5                      #   step-rate resonance; TPFD 4 = mid-band damping on
driver_HSTRT: 0
driver_HEND: 2
driver_TPFD: 4

# ---- Slot 1 / MOTOR1 — Y (B) ---------------------------------------
[stepper_y]
step_pin: y_step_pin
dir_pin: !y_dir_pin
enable_pin: !y_enable_pin
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_min: -10
position_endstop: -10               # homes against the FRONT stop
position_max: 250                   # 255 possible; 250 keeps the duct off the rear belt tower
homing_speed: 20
homing_retract_dist: 0

[tmc5160 stepper_y]
cs_pin: y_cs_pin
spi_bus: spi1
run_current: 1.0
sense_resistor: 0.075
stealthchop_threshold: 0
diag1_pin: ^!y_diag_pin
driver_SGT: 1
driver_TBL: 2
driver_TOFF: 5
driver_HSTRT: 0
driver_HEND: 2
driver_TPFD: 4

#####################################################################
#  Z — 3x 17HS15-1504S-X1 on TR8x2, TMC5160 V1.x, 24 V
#  Slot 2 = front-left, slot 3 = front-right, slot 4 = rear-centre
#  NOTE Octopus Pro V1.1: MOTOR3 enable is PA2 (PA0 is HE0 on V1.1)
#####################################################################

# ---- Slot 2 / MOTOR2 — Z front-left --------------------------------
[stepper_z]
step_pin: z_step_pin
dir_pin: z_dir_pin
enable_pin: !z_enable_pin
microsteps: 16
rotation_distance: 2
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 250                   # real travel not yet measured
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 0              # required by Beacon

[tmc5160 stepper_z]
cs_pin: z_cs_pin
spi_bus: spi1
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

# ---- Slot 3 / MOTOR3 — Z1 front-right ------------------------------
[stepper_z1]
step_pin: z1_step_pin
dir_pin: z1_dir_pin
enable_pin: !z1_enable_pin
microsteps: 16
rotation_distance: 2

[tmc5160 stepper_z1]
cs_pin: z1_cs_pin
spi_bus: spi1
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

# ---- Slot 4 / MOTOR4 — Z2 rear-centre ------------------------------
[stepper_z2]
step_pin: z2_step_pin
dir_pin: z2_dir_pin
enable_pin: !z2_enable_pin
microsteps: 16
rotation_distance: 2

[tmc5160 stepper_z2]
cs_pin: z2_cs_pin
spi_bus: spi1
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

# ---- Bed levelling ---------------------------------------------------
[z_tilt]
z_positions:                        # lead-screw X,Y (nozzle frame) — order = stepper_z, z1, z2
    -60, -13                        # front-left  (slot 2)  — estimated from FR + Hydra geometry
    290, -13                        # front-right (slot 3)  — measured
    115, 267                        # rear-centre (slot 4)  — estimated
points:                             # NOZZLE positions; Beacon coil lands 17 mm behind these
    40, -2                          # probe at (40, 15)
    230, -2                         # probe at (230, 15)
    130, 223                        # probe at (130, 240)
speed: 150
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.01

#####################################################################
#  Heated bed — Hydra 600 W mains via Omron G3NA-210B SSR on BED_OUT
#  (BED POWER input terminal must be fed 24 V for the SSR drive)
#  NTC 100k 3950 on TH0.  PID gains in SAVE_CONFIG block.
#  TODO: KSD301 NC 150 °C cutoff in the mains line; surface thermistor on PF4
#####################################################################
[heater_bed]
heater_pin: bed_heater_pin
sensor_type: Generic 3950
sensor_pin: bed_sensor_pin
min_temp: 0
max_temp: 130

#####################################################################
#  Electronics cooling
#####################################################################
[controller_fan driver_fan]         # Ender 5 blower on FAN2 (jumper 24 V), aimed at slots 0–2
pin: driver_fan_pin
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2
fan_speed: 1.0
idle_speed: 0.3
idle_timeout: 120

#####################################################################
#  Misc
#####################################################################
[exclude_object]                    # per-object cancel + adaptive mesh
[respond]                           # action:prompt dialogs
[gcode_arcs]
resolution: 0.1
[idle_timeout]
timeout: 1800

#####################################################################
#  Includes
#####################################################################
[include mainsail.cfg]
[include settings.cfg]
[include ebb36.cfg]
[include beacon.cfg]
[include macros/*.cfg]

[save_variables]
filename: ~/printer_data/config/variables.cfg   # measured values (nozzle expansion); not in git

