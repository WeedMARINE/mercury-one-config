#####################################################################
#  printer.cfg — ZeroG Mercury One.1 "Hydra"
#  Octopus Pro V1.1 (STM32H723, 128K bootloader, 25 MHz) + EBB36 GEN2 (USB)
#  Pi 5 · Klipper/Moonraker/Mainsail · PrusaSlicer
#
#  Frame of reference: X=0,Y=0 = front-left corner of the build sheet.
#  Printable area 260 x 250.  X homes RIGHT (sensorless), Y homes FRONT.
#  +Z lowers the bed.  Z homes by Beacon nozzle contact at bed centre (130,130).
#
#  Layout:  printer.cfg          Octopus side: motion, Z, bed, bay fan (this file)
#           toolhead.cfg         EBB36 side: extruder, hotend, fans, probe,
#                                bed_mesh, filament sensor pins
#           macros/homing.cfg    (empty since Beacon: homing hooks live in [beacon])
#           macros/print.cfg     START/END_PRINT, PURGE_LINE, pause settings
#           macros/filament.cfg  guided LOAD/UNLOAD, Orbiter button
#           macros/calibration.cfg  G32, resonance tester, PID helpers
#           mainsail.cfg         PAUSE/RESUME/CANCEL (symlink, don't edit)
#  Autosaved values (PIDs, z_offset, mesh) live in the SAVE_CONFIG block.
#####################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_20001B001351323431323537-if00

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 6000                     # MZV on Y allows ~6.7k; was 5000
minimum_cruise_ratio: 0.5
square_corner_velocity: 5
max_z_velocity: 10
max_z_accel: 100

[input_shaper]                      # Shake&Tune 2026-11-18, Beacon accelerometer at the nozzle, on the table
shaper_type_x: mzv                  # X single peak 64.8 Hz
shaper_freq_x: 66.0
shaper_type_y: mzv                  # Y 45.4 Hz main + 70 Hz minor (6.7 % residual). Alt: 2hump_ei 66.8 @ accel 4500
shaper_freq_y: 47.6

[force_move]
enable_force_move: True

#####################################################################
#  A/B motion — LDO 42STH48-2004MAH 0.9°, 48 V MOTOR_POWER
#  TMC5160T Pro, DIAG jumpers fitted, sensorless homing
#####################################################################

# ---- Slot 0 / MOTOR0 — X (A) ---------------------------------------
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_min: -20                   # sheet left edge is 20 mm right of the left stop
position_endstop: 270               # homes against the RIGHT stop
position_max: 270
homing_speed: 20
homing_retract_dist: 0              # back-off handled in homing.cfg

[tmc5160 stepper_x]
cs_pin: PC4
spi_bus: spi1
run_current: 1.0                    # no hold_current: driver fan handles standstill heat
sense_resistor: 0.075
stealthchop_threshold: 0
diag1_pin: ^!PG6
driver_SGT: 1                       # sensorless sensitivity (lower = more sensitive)
driver_TBL: 2                       # chopper: live-tested 2026-11-15 against the 40/80 mm/s
driver_TOFF: 5                      #   step-rate resonance; TPFD 4 = mid-band damping on
driver_HSTRT: 0
driver_HEND: 2
driver_TPFD: 4

# ---- Slot 1 / MOTOR1 — Y (B) ---------------------------------------
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_min: -10
position_endstop: -10               # homes against the FRONT stop
position_max: 250                   # 255 possible; 250 keeps the duct off the rear belt tower
homing_speed: 20
homing_retract_dist: 0

[tmc5160 stepper_y]
cs_pin: PD11
spi_bus: spi1
run_current: 1.0
sense_resistor: 0.075
stealthchop_threshold: 0
diag1_pin: ^!PG9
driver_SGT: 1
driver_TBL: 2
driver_TOFF: 5
driver_HSTRT: 0
driver_HEND: 2
driver_TPFD: 4

#####################################################################
#  Z — 3x 17HS15-1504S-X1 on TR8x2, TMC5160 V1.x, 24 V
#  Slot 2 = front-left, slot 3 = front-right, slot 4 = rear-centre
#  NOTE Octopus Pro V1.1: MOTOR3 enable is PA2 (PA0 is HE0 on V1.1)
#####################################################################

# ---- Slot 2 / MOTOR2 — Z front-left --------------------------------
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 2
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 250                   # real travel not yet measured
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 0              # required by Beacon

[tmc5160 stepper_z]
cs_pin: PC6
spi_bus: spi1
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

# ---- Slot 3 / MOTOR3 — Z1 front-right ------------------------------
[stepper_z1]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 2

[tmc5160 stepper_z1]
cs_pin: PC7
spi_bus: spi1
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

# ---- Slot 4 / MOTOR4 — Z2 rear-centre ------------------------------
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 2

[tmc5160 stepper_z2]
cs_pin: PF2
spi_bus: spi1
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

# ---- Bed levelling ---------------------------------------------------
[z_tilt]
z_positions:                        # lead-screw X,Y (nozzle frame) — order = stepper_z, z1, z2
    -60, -13                        # front-left  (slot 2)  — estimated from FR + Hydra geometry
    290, -13                        # front-right (slot 3)  — measured
    115, 267                        # rear-centre (slot 4)  — estimated
points:                             # NOZZLE positions; Beacon coil lands 17 mm behind these
    40, -2                          # probe at (40, 15)
    230, -2                         # probe at (230, 15)
    130, 223                        # probe at (130, 240)
speed: 150
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.01

#####################################################################
#  Heated bed — Hydra 600 W mains via Omron G3NA-210B SSR on BED_OUT
#  (BED POWER input terminal must be fed 24 V for the SSR drive)
#  NTC 100k 3950 on TH0.  PID gains in SAVE_CONFIG block.
#  TODO: KSD301 NC 150 °C cutoff in the mains line; surface thermistor on PF4
#####################################################################
[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
min_temp: 0
max_temp: 130

#####################################################################
#  Electronics cooling
#####################################################################
[controller_fan driver_fan]         # Ender 5 blower on FAN2 (jumper 24 V), aimed at slots 0–2
pin: PD12
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2
fan_speed: 1.0
idle_speed: 0.3
idle_timeout: 120

#####################################################################
#  Misc
#####################################################################
[exclude_object]                    # per-object cancel + adaptive mesh
[respond]                           # action:prompt dialogs
[gcode_arcs]
resolution: 0.1
[idle_timeout]
timeout: 1800

#####################################################################
#  Includes
#####################################################################
[include mainsail.cfg]
[include ebb36.cfg]
[include beacon.cfg]
[include macros/*.cfg]

[save_variables]
filename: ~/printer_data/config/variables.cfg   # measured values (nozzle expansion); not in git

