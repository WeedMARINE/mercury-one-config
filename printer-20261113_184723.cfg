# This file contains common pin mappings for the BigTreeTech Octopus
# Pro v1.0 board.

# Important! Do not use this config with an Octopus Pro v1.1 board, as
# doing so could result in a heater being inadvertently enabled.

# To use this config, start by identifying the microcontroller on the
# board - it may be an STM32F446, STM32F429, or an STM32H723.  Select
# the appropriate microcontroller in "make menuconfig" and select
# "Enable low-level configuration options". For STM32F446 boards the
# firmware should be compiled with a "32KiB bootloader" and a "12MHz
# crystal" clock reference. For STM32F429 boards, use a "32KiB
# bootloader" and an "8MHz crystal". For STM32H723 boards, use a
# "128KiB bootloader" and a "25Mhz crystal".

# See docs/Config_Reference.md for a description of parameters.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_20001B001351323431323537-if00
# CAN bus is also available on this board

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 10
max_z_accel: 100

[force_move]
enable_force_move: True

#####################################################################
# Slot 0 — Motor 0 — X (A) — 5160T Pro — VERIFIED
#####################################################################
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_min: -20
position_endstop: 270
position_max: 270
homing_speed: 20
homing_retract_dist: 0

[tmc5160 stepper_x]
cs_pin: PC4
spi_bus: spi1
run_current: 1.0
sense_resistor: 0.075
stealthchop_threshold: 0
diag1_pin: ^!PG6
driver_SGT: 1          # sensorless sensitivity, tune later (-64 most sensitive … 63 least)
driver_TBL: 1
driver_TOFF: 3
driver_HSTRT: 0
driver_HEND: 2
driver_TPFD: 0

#####################################################################
# Slot 1 — Motor 1 — Y (B) — 5160T Pro — VERIFIED
#####################################################################
[stepper_y]
step_pin: PG0
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_min: -10
position_endstop: -10
position_max: 250
homing_speed: 20
homing_retract_dist: 0

[tmc5160 stepper_y]
cs_pin: PD11
spi_bus: spi1
run_current: 1.0
sense_resistor: 0.075
stealthchop_threshold: 0
diag1_pin: ^!PG9
driver_SGT: 1
driver_TBL: 1
driver_TOFF: 3
driver_HSTRT: 0
driver_HEND: 2
driver_TPFD: 0

#####################################################################
# Slot 2 — Motor 2 — Z — 5160 V1.x — VERIFIED
#####################################################################
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 2
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 300                   # trim after measuring real travel
homing_speed: 10
second_homing_speed: 3

[tmc5160 stepper_z]
cs_pin: PC6
spi_bus: spi1
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

#####################################################################
# Slot 3 — Motor 3 — Z1 — 5160 V1.x — VERIFIED
#####################################################################
[stepper_z1]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 2

[tmc5160 stepper_z1]
cs_pin: PC7
spi_bus: spi1
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

#####################################################################
# Slot 4 — Motor 4 — Z2 — 5160 V1.x
#####################################################################
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 2

[tmc5160 stepper_z2]
cs_pin: PF2
spi_bus: spi1
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

#####################################################################
#Z tilt
#####################################################################

[z_tilt]
z_positions:                        # lead-screw X,Y in nozzle coords — order = stepper_z, z1, z2
    -60, -13                        # front-left  (motor 2)
    290, -13                        # front-right (motor 3)
    115, 267                        # rear-centre (motor 4)
points:                             # NOZZLE positions; probe lands 35.75 left / 8.75 front of these
    75.75, 18.75                    # probe at (40, 10)   front-left
    265.75, 18.75                   # probe at (230, 10)  front-right
    150.75, 245                  # probe at (115, 250) rear-centre
horizontal_move_z: 10               # more clearance until the first levelling is done
speed: 150
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.01

#####################################################################
# Heatbed - 220V 600W with NTC 100k 3950 connected through Omron G3NA
#####################################################################
[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
min_temp: 0
max_temp: 130
#PID gains are at the end of this file.

# [fan]
# pin: PA8

#[heater_fan fan1]
#pin: PE5

[controller_fan driver_fan]
pin: PD12                           # FAN2, jumper on 24V
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2
fan_speed: 1.0
idle_speed: 0.3                     # trickle while idle so hold-current heat clears
idle_timeout: 120

#[heater_fan fan3]
#pin: PD13

#[heater_fan fan4]
#pin: PD14

#[controller_fan fan5]
#pin: PD15


